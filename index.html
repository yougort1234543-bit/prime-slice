<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME & SLICE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #d4af37; --bg-color: #0b0c10; }
    body { background-color: var(--bg-color); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    
    /* تنسيق القائمة */
    .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.05); margin-bottom: 10px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); }
    .item-info { display: flex; align-items: center; gap: 15px; }
    .item-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--gold); }
    .item-name { font-weight: bold; font-size: 1.1rem; }
    .item-price { color: var(--gold); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div id="menu-container"></div>
  </div>

  <script>
    // ضع هنا روابط صورك الحقيقية
    const menuItems = [
      { name: "بيتزا مارجريتا", price: 120, img: "https://i.imgur.com/example1.jpg" }, 
      { name: "شاورما دجاج", price: 70, img: "https://i.imgur.com/example2.jpg" },
      { name: "كريب نوتيلا", price: 60, img: "https://i.imgur.com/example3.jpg" }
    ];

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = menuItems.map(item => `
        <div class="menu-item">
          <div class="item-info">
            <img src="${item.img}" class="item-img" alt="${item.name}">
            <span class="item-name">${item.name}</span>
          </div>
          <span class="item-price">${item.price} ج.م</span>
        </div>
      `).join('');
    }

    renderMenu();
  </script>
</body>
</html>
