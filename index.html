<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME & SLICE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #050505;
      --gold: #d4af37;
      --card-bg: rgba(15, 16, 20, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-color); color: #fff; min-height: 100vh; overflow-x: hidden; }

    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 15px; text-align: center; }

    .hero { margin-bottom: 15px; }
    .hero h1 { font-size: 2.2rem; color: var(--gold); margin-bottom: 2px; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.9); }
    .hero p { color: #ccc; font-size: 0.95rem; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }

    .star-rating { cursor: pointer; font-size: 26px; display: flex; justify-content: center; direction: ltr; margin: 5px 0; }
    .star { color: #555; transition: color 0.2s; }
    .star.active { color: var(--gold); }
    #rating-result { color: var(--gold); font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; }

    .contact-info { color: #aaa; margin-bottom: 15px; font-size: 0.85rem; text-shadow: 0 2px 4px #000; }

    .home-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; perspective: 1000px; margin-bottom: 20px; }
    
    .btn-3d {
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      background: linear-gradient(to bottom, #d4af37, #b8860b);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8b6508;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s;
      will-change: transform;
    }
    
    .btn-3d:active { transform: translateY(6px) scale(1) !important; box-shadow: 0 0 0 #8b6508 !important; }

    .page { display: none; background: var(--card-bg); backdrop-filter: blur(8px); padding: 20px; border-radius: 18px; border: 1px solid rgba(212, 175, 55, 0.4); max-height: 75vh; overflow-y: auto; }
    .page.active { display: block; animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .page h2 { color: var(--gold); margin-bottom: 15px; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding-bottom: 6px; font-size: 1.3rem; }
    .back-btn { margin-top: 15px; background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
    .back-btn:hover { background: var(--gold); color: #000; }
    
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 10px;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .item-img-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      margin-bottom: 8px;
    }

    .item-name-large { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; color: #fff; }
    .menu-card span.price { color: var(--gold); font-weight: bold; font-size: 0.85rem; }

    .size-selector { display: flex; gap: 4px; margin: 6px 0; }
    .size-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--gold);
      color: #fff;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .size-btn.active { background: var(--gold); color: #000; }

    .page::-webkit-scrollbar { width: 5px; }
    .page::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    .lang-switcher {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 16, 20, 0.9);
      border: 1px solid var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      gap: 8px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 10px;
      transition: 0.3s;
    }
    .lang-btn.active { background: var(--gold); color: #000; }

    .footer-credit { position: fixed; bottom: 5px; width: 100%; text-align: center; color: #666; font-size: 0.7rem; z-index: 2; pointer-events: none; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="container">
    <div id="home" class="page active">
      <div class="hero">
        <h1>PRIME & SLICE</h1>
        <p id="txt-sub">مرحباً بكم في تجربة التذوق الفاخرة</p>
      </div>
      
      <div class="star-rating" id="star-rating">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <p id="rating-result">قيمنا: 0 من 5</p>

      <div class="contact-info">📞 0123 456 7890 | 📧 contact@prime.com</div>

      <div class="home-buttons">
        <button class="btn-3d" id="btn-pizza" data-hover="false" onclick="showPage('pizza')">🍕 البيتزا</button>
        <button class="btn-3d" id="btn-shawarma" data-hover="false" onclick="showPage('shawarma')">🥙 الشاورما</button>
        <button class="btn-3d" id="btn-crepe" data-hover="false" onclick="showPage('crepe')">🌯 الكريب</button>
        <button class="btn-3d" id="btn-drinks" data-hover="false" onclick="showPage('drinks')">🍹 المشروبات</button>
      </div>
    </div>

    <div id="pizza" class="page"><h2 id="title-pizza">🍕 قائمة البيتزا</h2><div id="pizza-list" class="menu-grid"></div><button class="back-btn back-txt" onclick="showPage('home')">العودة</button></div>
    <div id="shawarma" class="page"><h2 id="title-shawarma">🥙 قائمة الشاورما</h2><div id="shawarma-list" class="menu-grid"></div><button class="back-btn back-txt" onclick="showPage('home')">العودة</button></div>
    <div id="crepe" class="page"><h2 id="title-crepe">🌯 قائمة الكريب</h2><div id="crepe-list" class="menu-grid"></div><button class="back-btn back-txt" onclick="showPage('home')">العودة</button></div>
    <div id="drinks" class="page"><h2 id="title-drinks">🍹 المشروبات</h2><div id="drinks-list" class="menu-grid"></div><button class="back-btn back-txt" onclick="showPage('home')">العودة</button></div>
  </div>

  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-ar" onclick="setLanguage('ar')">Ar</button>
    <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">En</button>
  </div>

  <div class="footer-credit">Produced by Yousef Abdelraheem</div>

  <script>
    let currentLang = 'ar';
    let currentRating = 0;

    const translations = {
      ar: {
        sub: "مرحباً بكم في تجربة التذوق الفاخرة",
        rating: "قيمنا: ",
        outOf: " من 5",
        thankYouAlert: "شكراً على تقييمك لنا! ❤️",
        pizzaBtn: "🍕 البيتزا",
        shawarmaBtn: "🥙 الشاورما",
        crepeBtn: "🌯 الكريب",
        drinksBtn: "🍹 المشروبات",
        pizzaTitle: "🍕 قائمة البيتزا",
        shawarmaTitle: "🥙 قائمة الشاورما",
        crepeTitle: "🌯 قائمة الكريب",
        drinksTitle: "🍹 المشروبات",
        back: "العودة",
        currency: "ج.م"
      },
      en: {
        sub: "Welcome to the premium tasting experience",
        rating: "Rate us: ",
        outOf: " of 5",
        thankYouAlert: "Thank you for rating us! ❤️",
        pizzaBtn: "🍕 Pizza",
        shawarmaBtn: "🥙 Shawarma",
        crepeBtn: "🌯 Crepe",
        drinksBtn: "🍹 Drinks",
        pizzaTitle: "🍕 Pizza Menu",
        shawarmaTitle: "🥙 Shawarma Menu",
        crepeTitle: "🌯 Crepe Menu",
        drinksTitle: "🍹 Drinks Menu",
        back: "Back",
        currency: "EGP"
      }
    };

    const menuData = {
      pizza: [
        { id: "p1", name: {ar: "مارجريتا إيطالي", en: "Italian Margherita"}, basePrice: 90, img: "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=500&q=80" },
        { id: "p2", name: {ar: "ببروني سوبريم", en: "Pepperoni Supreme"}, basePrice: 120, img: "https://images.pexels.com/photos/4109111/pexels-photo-4109111.jpeg?auto=compress&cs=tinysrgb&w=500" },
        { id: "p3", name: {ar: "باربيكيو تشيكن", en: "BBQ Chicken"}, basePrice: 130, img: "https://cdn.pixabay.com/photo/2017/12/09/08/18/pizza-3007395_1280.jpg" },
        { id: "p4", name: {ar: "ميت لافرز", en: "Meat Lovers"}, basePrice: 140, img: "https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?auto=format&fit=crop&w=500&q=80" },
        { id: "p5", name: {ar: "سي فود سوبريم", en: "Seafood Supreme"}, basePrice: 160, img: "https://images.pexels.com/photos/1146760/pexels-photo-1146760.jpeg?auto=compress&cs=tinysrgb&w=500" }
      ],
      shawarma: [
        { name: {ar: "شاورما دجاج صاج", en: "Saj Chicken Shawarma"}, price: 70, img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
        { name: {ar: "شاورما لحم صاج", en: "Saj Beef Shawarma"}, price: 90, img: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?auto=format&fit=crop&w=500&q=80" }
      ],
      crepe: [
        { name: {ar: "كريب بانيه", en: "Pane Crepe"}, price: 75, img: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=500&q=80" }
      ],
      drinks: [
        { name: {ar: "مانجو فريش", en: "Fresh Mango"}, price: 45, img: "https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=500&q=80" }
      ]
    };

    function setPizzaSize(pizzaId, size, price, btn) {
      document.getElementById(`price-${pizzaId}`).innerText = `${price} ${translations[currentLang].currency}`;
      const parent = btn.parentElement;
      parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function renderMenu() {
      let pizzaHtml = '';
      menuData.pizza.forEach(item => {
        const pSmall = item.basePrice;
        const pMedium = item.basePrice + 30;
        const pLarge = item.basePrice + 60;

        pizzaHtml += `
          <div class="menu-card">
            <img class="item-img-large" src="${item.img}" alt="${item.name[currentLang]}">
            <span class="item-name-large">${item.name[currentLang]}</span>
            <div class="size-selector">
              <button class="size-btn active" onclick="setPizzaSize('${item.id}', 'S', ${pSmall}, this)">S</button>
              <button class="size-btn" onclick="setPizzaSize('${item.id}', 'M', ${pMedium}, this)">M</button>
              <button class="size-btn" onclick="setPizzaSize('${item.id}', 'L', ${pLarge}, this)">L</button>
            </div>
            <span class="price" id="price-${item.id}">${pSmall} ${translations[currentLang].currency}</span>
          </div>`;
      });
      document.getElementById('pizza-list').innerHTML = pizzaHtml;

      ['shawarma', 'crepe', 'drinks'].forEach(key => {
        let html = '';
        menuData[key].forEach(item => {
          html += `
            <div class="menu-card">
              <img class="item-img-large" src="${item.img}" alt="${item.name[currentLang]}">
              <span class="item-name-large">${item.name[currentLang]}</span>
              <span class="price">${item.price} ${translations[currentLang].currency}</span>
            </div>`;
        });
        document.getElementById(key+'-list').innerHTML = html;
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      document.getElementById('txt-sub').innerText = translations[lang].sub;
      document.getElementById('btn-pizza').innerText = translations[lang].pizzaBtn;
      document.getElementById('btn-shawarma').innerText = translations[lang].shawarmaBtn;
      document.getElementById('btn-crepe').innerText = translations[lang].crepeBtn;
      document.getElementById('btn-drinks').innerText = translations[lang].drinksBtn;

      document.getElementById('title-pizza').innerText = translations[lang].pizzaTitle;
      document.getElementById('title-shawarma').innerText = translations[lang].shawarmaTitle;
      document.getElementById('title-crepe').innerText = translations[lang].crepeTitle;
      document.getElementById('title-drinks').innerText = translations[lang].drinksTitle;

      document.querySelectorAll('.back-txt').forEach(btn => btn.innerText = translations[lang].back);
      document.getElementById('rating-result').innerText = translations[lang].rating + currentRating + translations[lang].outOf;

      renderMenu();
    }

    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', function() {
        currentRating = this.getAttribute('data-value');
        document.querySelectorAll('.star').forEach((s, index) => {
          s.classList.toggle('active', index < currentRating);
        });
        document.getElementById('rating-result').innerText = translations[currentLang].rating + currentRating + translations[currentLang].outOf;
        alert(translations[currentLang].thankYouAlert);
      });
    });

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    const buttons = document.querySelectorAll('.btn-3d');
    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', () => btn.dataset.hover = "true");
      btn.addEventListener('mouseleave', () => btn.dataset.hover = "false");
    });

    function handleMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const mouseX = (clientX / window.innerWidth - 0.5) * 2;
      const mouseY = (clientY / window.innerHeight - 0.5) * 2;

      buttons.forEach(btn => {
        const moveX = mouseX * 8;
        const moveY = mouseY * 8;
        const rotateX = -mouseY * 8;
        const rotateY = mouseX * 8;
        const scale = btn.dataset.hover === "true" ? 1.1 : 1;
        btn.style.transform = `translate3d(${moveX}px, ${moveY}px, 0px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scale})`;
      });

      if (typeof mainSetGroup !== 'undefined') {
        mainSetGroup.rotation.y = mouseX * 0.2;
        mainSetGroup.rotation.x = mouseY * 0.2;
      }
    }

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove);

    // --- إعداد المشهد الذهبي مع ضبط الحجم للأجهزة المحمولة ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    camera.position.set(0, 0, 9);

    const mainSetGroup = new THREE.Group();

    const goldMaterial = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      metalness: 0.85,
      roughness: 0.15
    });

    // 1. الطبق
    const plateGroup = new THREE.Group();
    const outerPlateGeo = new THREE.CylinderGeometry(2.2, 2.0, 0.15, 64);
    const outerPlate = new THREE.Mesh(outerPlateGeo, goldMaterial);
    outerPlate.rotation.x = Math.PI / 2;
    plateGroup.add(outerPlate);

    const innerPlateGeo = new THREE.CylinderGeometry(1.5, 1.4, 0.1, 64);
    const innerPlate = new THREE.Mesh(innerPlateGeo, goldMaterial);
    innerPlate.rotation.x = Math.PI / 2;
    innerPlate.position.z = 0.03;
    plateGroup.add(innerPlate);

    const dotsCount = 48;
    const dotsRadius = 2.08;
    for (let i = 0; i < dotsCount; i++) {
      const angle = (i / dotsCount) * Math.PI * 2;
      const dotGeo = new THREE.SphereGeometry(0.025, 8, 8);
      const dot = new THREE.Mesh(dotGeo, goldMaterial);
      dot.position.set(Math.cos(angle) * dotsRadius, Math.sin(angle) * dotsRadius, 0.08);
      plateGroup.add(dot);
    }
    mainSetGroup.add(plateGroup);

    // 2. الشوكة
    const forkGroup = new THREE.Group();
    const forkHandleGeo = new THREE.CylinderGeometry(0.06, 0.03, 2.5, 16);
    const forkHandle = new THREE.Mesh(forkHandleGeo, goldMaterial);
    forkHandle.position.y = -0.5;
    forkGroup.add(forkHandle);

    const forkHeadBaseGeo = new THREE.BoxGeometry(0.35, 0.1, 0.05);
    const forkHeadBase = new THREE.Mesh(forkHeadBaseGeo, goldMaterial);
    forkHeadBase.position.y = 0.8;
    forkGroup.add(forkHeadBase);

    for (let i = 0; i < 4; i++) {
      const prongGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.9, 8);
      const prong = new THREE.Mesh(prongGeo, goldMaterial);
      prong.position.set(-0.13 + (i * 0.088), 1.25, 0);
      forkGroup.add(prong);
    }
    forkGroup.position.set(-2.8, 0, 0);
    mainSetGroup.add(forkGroup);

    // 3. السكينة
    const knifeGroup = new THREE.Group();
    const knifeHandleGeo = new THREE.CylinderGeometry(0.06, 0.03, 2.5, 16);
    const knifeHandle = new THREE.Mesh(knifeHandleGeo, goldMaterial);
    knifeHandle.position.y = -0.5;
    knifeGroup.add(knifeHandle);

    const knifeBladeShape = new THREE.Shape();
    knifeBladeShape.moveTo(0, 0);
    knifeBladeShape.lineTo(0.2, 0.2);
    knifeBladeShape.lineTo(0.18, 1.4);
    knifeBladeShape.lineTo(0, 1.5);
    knifeBladeShape.closePath();

    const knifeExtrude = { depth: 0.03, bevelEnabled: true, bevelSize: 0.01, bevelThickness: 0.01 };
    const knifeBladeGeo = new THREE.ExtrudeGeometry(knifeBladeShape, knifeExtrude);
    const knifeBlade = new THREE.Mesh(knifeBladeGeo, goldMaterial);
    knifeBlade.position.set(-0.05, 0.75, -0.015);
    knifeGroup.add(knifeBlade);

    knifeGroup.position.set(2.8, 0, 0);
    mainSetGroup.add(knifeGroup);

    scene.add(mainSetGroup);

    // إضاءة
    const ambientLight = new THREE.AmbientLight(0xfff5e6, 1.2);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffdf80, 2.2);
    mainLight.position.set(2, 5, 8);
    scene.add(mainLight);

    const sideLight = new THREE.PointLight(0xffa500, 1.5, 20);
    sideLight.position.set(-5, 2, 5);
    scene.add(sideLight);

    // دالة التكيف التلقائي مع شاشات الهواتف
    function updateLayout() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      if (window.innerWidth < 600) {
        // تصغير الحجم وإرجاع الكاميرا للوراء في الهاتف
        const scaleFactor = Math.max(0.55, window.innerWidth / 600 * 0.75);
        mainSetGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
        camera.position.z = 10;
      } else {
        mainSetGroup.scale.set(1, 1, 1);
        camera.position.z = 8.5;
      }

      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', updateLayout);
    updateLayout();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    renderMenu();
  </script>
</body>
</html>
