<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0c10;
      --gold: #d4af37;
      --card-bg: rgba(25, 27, 32, 0.95);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-color); color: #fff; min-height: 100vh; overflow-x: hidden; }

    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 20px 20px; text-align: center; }

    .hero { margin-bottom: 20px; }
    .hero h1 { font-size: 3rem; color: var(--gold); margin-bottom: 5px; letter-spacing: 2px; }
    .hero p { color: #aaa; font-size: 1.1rem; }

    .star-rating { cursor: pointer; font-size: 30px; display: flex; justify-content: center; direction: ltr; margin: 10px 0; }
    .star { color: #555; transition: color 0.2s; }
    .star.active { color: var(--gold); }
    #rating-result { color: var(--gold); font-weight: bold; margin-bottom: 15px; }

    .contact-info { color: #888; margin-bottom: 20px; font-size: 0.95rem; }

    .home-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; perspective: 1000px; margin-bottom: 30px; }
    
    .btn-3d {
      padding: 25px 15px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #000;
      background: linear-gradient(to bottom, #d4af37, #b8860b);
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 8px 0 #8b6508;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s;
      will-change: transform;
    }
    
    .btn-3d:active { transform: translateY(8px) scale(1) !important; box-shadow: 0 0 0 #8b6508 !important; }

    .page { display: none; background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--gold); max-height: 70vh; overflow-y: auto; }
    .page.active { display: block; animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .page h2 { color: var(--gold); margin-bottom: 20px; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding-bottom: 8px; }
    .back-btn { margin-top: 20px; background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
    .back-btn:hover { background: var(--gold); color: #000; }
    
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 10px;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.3s, border-color 0.3s;
    }

    .menu-card:hover {
      border-color: var(--gold);
      transform: translateY(-5px);
    }

    .item-img-large {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .item-name-large {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #fff;
    }

    .menu-card span.price {
      color: var(--gold);
      font-weight: bold;
      font-size: 1rem;
    }

    .page::-webkit-scrollbar { width: 6px; }
    .page::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    .lang-switcher {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(25, 27, 32, 0.9);
      border: 1px solid var(--gold);
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      gap: 10px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 10px;
      transition: 0.3s;
    }
    .lang-btn.active {
      background: var(--gold);
      color: #000;
    }

    .footer-credit { position: fixed; bottom: 8px; width: 100%; text-align: center; color: #555; font-size: 0.75rem; z-index: 2; pointer-events: none; }

    @media (max-width: 600px) {
      .home-buttons { grid-template-columns: 1fr; }
      .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .item-img-large { width: 110px; height: 110px; }
    }
  </style>
</head>

        { name: {ar: "جوافة لبن", en: "Guava with Milk"}, price: 35 },
        { name: {ar: "كيوي وموز", en: "Kiwi Banana"}, price: 50 },
        { name: {ar: "ليمون نعناع", en: "Lemon Mint"}, price: 30 },
        { name: {ar: "كوكتيل استوائي", en: "Tropical Cocktail"}, price: 55 },
        { name: {ar: "آيس كريم فانيليا", en: "Vanilla Ice Cream"}, price: 40 },
        { name: {ar: "آيس كريم شوكو", en: "Choco Ice Cream"}, price: 40 },
        { name: {ar: "آيس كريم أوريو", en: "Oreo Ice Cream"}, price: 50 },
        { name: {ar: "ميلك شيك كراميل", en: "Caramel Milkshake"}, price: 55 },
        { name: {ar: "ميلك شيك توت", en: "Berry Milkshake"}, price: 55 },
        { name: {ar: "موهيتو بلو", en: "Blue Mojito"}, price: 45 },
        { name: {ar: "موهيتو رمان", en: "Pomegranate Mojito"}, price: 45 },
        { name: {ar: "برتقال فريش", en: "Fresh Orange"}, price: 35 },
        { name: {ar: "أناناس فريش", en: "Fresh Pineapple"}, price: 50 },
        { name: {ar: "أفوكادو عسل", en: "Avocado with Honey"}, price: 70 },
        { name: {ar: "آيس كافيه", en: "Iced Coffee"}, price: 45 },
        { name: {ar: "سموذي بطيخ", en: "Watermelon Smoothie"}, price: 40 },
        { name: {ar: "تشيز كيك مثلج", en: "Iced Cheesecake"}, price: 60 },
        { name: {ar: "كوكتيل الملوكي", en: "Royal Mix Cocktail"}, price: 75 }
      ]
    };

    function renderMenu() {
      for (let key in menuData) {
        let html = '';
        menuData[key].forEach(item => {
          const imgTag = item.img ? `<img class="item-img-large" src="${item.img}" alt="${item.name[currentLang]}">` : '';
          html += `
            <div class="menu-card">
              ${imgTag}
              <span class="item-name-large">${item.name[currentLang]}</span>
              <span class="price">${item.price} ${translations[currentLang].currency}</span>
            </div>`;
        });
        document.getElementById(key+'-list').innerHTML = html;
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      document.getElementById('txt-sub').innerText = translations[lang].sub;
      document.getElementById('btn-pizza').innerText = translations[lang].pizzaBtn;
      document.getElementById('btn-shawarma').innerText = translations[lang].shawarmaBtn;
      document.getElementById('btn-crepe').innerText = translations[lang].crepeBtn;
      document.getElementById('btn-drinks').innerText = translations[lang].drinksBtn;

      document.getElementById('title-pizza').innerText = translations[lang].pizzaTitle;
      document.getElementById('title-shawarma').innerText = translations[lang].shawarmaTitle;
      document.getElementById('title-crepe').innerText = translations[lang].crepeTitle;
      document.getElementById('title-drinks').innerText = translations[lang].drinksTitle;

      document.querySelectorAll('.back-txt').forEach(btn => btn.innerText = translations[lang].back);

      document.getElementById('rating-result').innerText = translations[lang].rating + currentRating + translations[lang].outOf;

      renderMenu();
    }

    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', function() {
        currentRating = this.getAttribute('data-value');
        document.querySelectorAll('.star').forEach((s, index) => {
          s.classList.toggle('active', index < currentRating);
        });
        document.getElementById('rating-result').innerText = translations[currentLang].rating + currentRating + translations[currentLang].outOf;
      });
    });

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    const buttons = document.querySelectorAll('.btn-3d');
    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', () => btn.dataset.hover = "true");
      btn.addEventListener('mouseleave', () => btn.dataset.hover = "false");
    });

    function handleMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const mouseX = (clientX / window.innerWidth - 0.5) * 2;
      const mouseY = (clientY / window.innerHeight - 0.5) * 2;

      buttons.forEach(btn => {
        const moveX = mouseX * 10;
        const moveY = mouseY * 10;
        const rotateX = -mouseY * 10;
        const rotateY = mouseX * 10;
        const scale = btn.dataset.hover === "true" ? 1.15 : 1;
        btn.style.transform = `translate3d(${moveX}px, ${moveY}px, 0px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scale})`;
      });

      if (typeof shape !== 'undefined') {
        shape.rotation.y = mouseX * 0.5;
        shape.rotation.x = mouseY * 0.5;
      }
    }

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    camera.position.z = 5;
    const geometry = new THREE.TorusKnotGeometry(1.5, 0.3, 100, 16);
    const material = new THREE.MeshStandardMaterial({ color: 0xd4af37, wireframe: true, metalness: 0.8 });
    const shape = new THREE.Mesh(geometry, material);
    scene.add(shape);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    function animate() {
      requestAnimationFrame(animate);
      shape.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    renderMenu();
  </script>
</body>
</html>
